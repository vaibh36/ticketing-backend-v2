name: Build and Push Ticketing Images

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-south-1
  AWS_ACCOUNT_ID: "051146571550"

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Show GitHub context
        run: |
          echo "Repository = $GITHUB_REPOSITORY"
          echo "Ref = $GITHUB_REF"
          echo "Actor = $GITHUB_ACTOR"

      - name: Show OIDC claims
        shell: python
        run: |
          import os
          import json
          import base64
          import urllib.request

          request_url = (
              os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"]
              + "&audience=sts.amazonaws.com"
          )

          request = urllib.request.Request(
              request_url,
              headers={
                  "Authorization":
                      "Bearer " + os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"]
              }
          )

          with urllib.request.urlopen(request) as response:
              token_response = json.loads(response.read().decode())

          token = token_response["value"]

          payload = token.split(".")[1]
          payload += "=" * (-len(payload) % 4)

          claims = json.loads(
              base64.urlsafe_b64decode(payload).decode()
          )

          print("OIDC audience =", claims.get("aud"))
          print("OIDC subject =", claims.get("sub"))
          print("Repository =", claims.get("repository"))
          print("Repository ID =", claims.get("repository_id"))
          print("Repository owner =", claims.get("repository_owner"))
          print("Repository owner ID =", claims.get("repository_owner_id"))
          print("Ref =", claims.get("ref"))

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::051146571550:role/ticketing-v2-github-actions-role
          aws-region: ap-south-1

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build event-service image
        run: |
          docker build \
            -t $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/ticketing-v2-event-service:latest \
            ./event-service

      - name: Push event-service image
        run: |
          docker push \
            $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/ticketing-v2-event-service:latest

      - name: Build booking-service image
        run: |
          docker build \
            -t $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/ticketing-v2-booking-service:latest \
            ./booking-service

      - name: Push booking-service image
        run: |
          docker push \
            $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/ticketing-v2-booking-service:latest

      - name: Build agent-service image
        run: |
          docker build \
            -t $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/ticketing-v2-agent-service:latest \
            ./agent-service

      - name: Push agent-service image
        run: |
          docker push \
            $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/ticketing-v2-agent-service:latest
